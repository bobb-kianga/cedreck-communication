<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt Management System</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-block">
        <div class="brand">Receipt System</div>
        <span class="tagline">Phone Transaction Records</span>
      </div>

      <form id="auth-form" class="auth-form">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Password" required />
        <button id="login-btn" type="submit">Login</button>
        <button id="register-btn" type="button" class="secondary">Register</button>
        <button id="logout-btn" type="button" class="ghost hidden">Logout</button>
      </form>
    </header>

    <main class="page">
      <section class="hero panel">
        <div>
          <p class="eyebrow">Transactions</p>
          <h1>Receipt Management</h1>
        </div>
        <label class="search-wrap">
          <span>Search</span>
          <input id="search-input" type="search" placeholder="Search by customer ID or name" />
        </label>
      </section>

      <section class="content-grid">
        <aside class="panel form-panel" id="user-form-section">
          <div class="panel-header">
            <h2>Create Receipt</h2>
            <div class="header-actions">
              <span class="status-badge" id="auth-status">Logged out</span>
              <button id="admin-view-btn" type="button" class="view-toggle-btn hidden">View All Receipts</button>
            </div>
          </div>

          <form id="phone-form" class="phone-form">
            <label>
              Customer Names
              <input name="customerName" type="text" placeholder="John Doe" required />
            </label>

            <label>
              Customer ID
              <input name="customerId" type="text" placeholder="CUST-001" required />
            </label>

            <label>
              Phone IMEI
              <input name="imei" type="text" placeholder="123456789012345" required />
            </label>

            <label>
              Next of Kin
              <input name="nextOfKin" type="text" placeholder="Jane Doe" required />
            </label>

            <label>
              Method of Payment
              <select name="paymentMethod" required>
                <option value="">Select payment method</option>
                <option>Cash</option>
                <option>Credit Card</option>
                <option>Debit Card</option>
                <option>Mobile Money</option>
                <option>Bank Transfer</option>
              </select>
            </label>

            <label>
              Date
              <input name="date" type="date" required />
            </label>

            <button type="submit" class="primary-btn">Generate Receipt</button>
          </form>
        </aside>

        <section class="panel listing-panel" id="admin-view-section" style="display: none;">
          <div class="panel-header">
            <h2>All Receipts (Admin View)</h2>
            <button id="user-view-btn" type="button" class="view-toggle-btn">Back to My Receipts</button>
          </div>
          <div id="phone-list" class="phone-grid"></div>
        </section>

        <section class="panel listing-panel" id="user-listing-panel">
          <div class="panel-header">
            <h2>Receipt List</h2>
          </div>
          <div id="phone-list-user" class="phone-grid"></div>
        </section>
      </section>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    
    <script type="module" src="./firebase-config.js"></script>
    <script type="module" src="./app-firebase.js"></script>
  </body>
</html>
